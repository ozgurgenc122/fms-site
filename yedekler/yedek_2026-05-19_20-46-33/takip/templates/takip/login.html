<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>FMS Giriş</title>
<style>
body { font-family: Arial; background:#f5f7f6; }
.box { width:360px; margin:120px auto; background:white; padding:25px; border-radius:8px; box-shadow:0 1px 8px #ccc; }
h2 { color:#0b6b53; }
input { width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box; }
button { width:100%; padding:10px; background:#0b6b53; color:white; border:0; border-radius:5px; }
.error { color:red; margin-bottom:10px; }
</style>
</head>
<body>

<div class="box">
<h2>FMS İş Takip</h2>

{% if form.errors %}
<div class="error">Kullanıcı adı veya şifre hatalı</div>
{% endif %}

<form method="post">
{% csrf_token %}
<input type="text" name="username" placeholder="Kullanıcı adı">
<input type="password" name="password" placeholder="Şifre">
<button type="submit">Giriş Yap</button>
</form>

</div>

</body>
</html>
